<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus & Flow Studio</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff3366">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Focus & Flow">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css?v=20250902">
    <script>
        // Force service worker unregister to clear cache
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                    console.log('Service Worker unregistered');
                }
            });
        }
        // Clear cache on load
        if ('caches' in window) {
            caches.keys().then(function(names) {
                for (let name of names) {
                    caches.delete(name);
                }
                console.log('Caches cleared');
            });
        }
    </script>
</head>
<body>

    <header>
        <h1 class="editable-title" contenteditable="true" id="app-title" onblur="saveAppName(this.textContent)">Focus & Flow Studio</h1>
        <p>Curate your day, honor your energy, and master your workflow.</p>

        <div class="clocks-bar">
            <div class="clock-item"><div class="clock-label">Date</div><div class="date-display" id="date-display">--/--/----</div></div>
            <div class="clock-item">
                <div class="clock-label">
                    <input type="text" class="clock-tz-search" id="clock-tz-search-1" placeholder="Search timezone..." list="tz-datalist" oninput="updateHeaderClockZone(1, this.value)">
                    <datalist id="tz-datalist"></datalist>
                </div>
                <div class="clock-time" id="clock-wat">--:--:--</div>
            </div>
            <div class="clock-item">
                <div class="clock-label">
                    <input type="text" class="clock-tz-search" id="clock-tz-search-2" placeholder="Search timezone..." list="tz-datalist" oninput="updateHeaderClockZone(2, this.value)">
                </div>
                <div class="clock-time" id="clock-est">--:--:--</div>
            </div>
            <div class="clock-item">
                <div class="clock-label">
                    <input type="text" class="clock-tz-search" id="clock-tz-search-3" placeholder="Search timezone..." list="tz-datalist" oninput="updateHeaderClockZone(3, this.value)">
                </div>
                <div class="clock-time" id="clock-mst">--:--:--</div>
            </div>
        </div>

        <div class="top-controls">
            <button class="btn-secondary" onclick="toggleDarkMode()">Toggle Dark Mode</button>
            <button class="btn-secondary" id="clock-btn" onclick="toggleClock()">Clock In</button>
        </div>
    </header>

    <div class="board-area">
        <div class="board-container" id="board-container">
            <div class="timer-card">
                <div id="mode-indicator">Work Time</div>
                <div class="timer-display" id="time-display">25:00</div>
                <div class="progress-bar-container"><div class="progress-bar" id="progress-bar"></div></div>

                <div class="controls">
                    <button id="start-pause-btn" onclick="toggleTimer()">Start</button>
                    <button id="reset-btn" onclick="resetTimer()">Restart</button>
                    <button class="btn-secondary" onclick="addFiveMinutes()" title="Add 5 minutes">+5 min</button>
                    <button class="btn-secondary" onclick="skipCurrentSegment()" title="Skip current segment">⏭ Skip</button>
                </div>

                <div class="settings">
                    <div class="setting-row">
                        <div class="setting-group"><label for="work-input">Work (min)</label><input type="number" id="work-input" value="25" min="1" max="120" onchange="updateSettings()"></div>
                        <div class="setting-group"><label for="break-input">Break (min)</label><input type="number" id="break-input" value="5" min="1" max="60" onchange="updateSettings()"></div>
                    </div>
                </div>
            </div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.8rem;">
            <span id="column-count-label" style="font-size:0.85rem;color:#888;">3/8 columns</span>
            <button class="add-task-btn" onclick="addColumn()">+ Add Column</button>
        </div>
    </div>

    <div class="discreet-card">
        <h4>Backup Your Data</h4>
        <div style="display:flex;gap:8px;">
            <button class="btn-secondary" style="flex:1;" onclick="exportAllDataJSON()">Export All Data (JSON)</button>
            <button class="btn-secondary" style="flex:1;" onclick="exportHistoryCSV()">Export History (CSV)</button>
        </div>
    </div>

    <div style="text-align:center; padding: 20px; opacity: 0.3;">
        <button onclick="document.getElementById('api-modal').style.display='flex'" style="background:none;border:none;cursor:pointer;font-size:1.2rem;">⚙️</button>
    </div>

    <div class="modal-overlay" id="api-modal">
        <div class="modal-box">
            <p>System Configuration</p>
            <input type="password" id="gemini-api-key-modal" style="width:100%;padding:8px;margin-bottom:10px;" placeholder="Gemini API Key">
            <button class="btn-primary" style="width:100%;" onclick="document.getElementById('api-modal').style.display='none'">Save & Close</button>
        </div>
    </div>

    <script src="app.js?v=20250902"></script>
    <script>
        // Export functions
        function exportAllDataJSON() {
            const data = {
                boardData: boardData,
                historyData: historyData,
                clockLog: clockLog,
                clockState: clockState,
                appSettings: appSettings
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `focus-flow-backup-${getTodayKey()}.json`;
            a.click();
        }

        function exportHistoryCSV() {
            const rows = [['Date','Client','Task','Estimate (min)','Actual (min)','Notes']];
            historyData.forEach(h => rows.push([dateKeyFromISO(h.completedAt), h.client, h.task, h.estimateMinutes, h.actualMinutes, (h.notes||'').replace(/"/g,'""')]));
            const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `focus-flow-history-${getTodayKey()}.csv`;
            a.click();
        }

        function addColumn() {
            if (boardData.length >= 8) { alert('Maximum of 8 columns.'); return; }
            boardData.push({ id: Date.now(), title: `New Project`, collapsed: false, tasks: [] });
            saveBoardData();
            renderBoard();
        }

        function saveAppName(name) {
            appSettings.appName = name.trim() || 'Focus & Flow Studio';
            storageSet('ff-app-settings', appSettings);
        }
        function saveApiKey(key) { storageSet('gemini_api_key', key); }

        // Make functions available globally
        window.exportAllDataJSON = exportAllDataJSON;
        window.exportHistoryCSV = exportHistoryCSV;
        window.addColumn = addColumn;
        window.saveAppName = saveAppName;
        window.saveApiKey = saveApiKey;
    </script>
</body>
</html>
